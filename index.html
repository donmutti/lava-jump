<!doctype html>
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lava Jump</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="A canvas platformer where you sprint with WASD and leap across lava to reach the goal.">

  <meta property="og:title" content="Lava Jump">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://lavajump.donmutti.com/">
  <meta property="og:image" content="https://lavajump.donmutti.com/icon.png">
  <meta property="og:image:alt" content="Lava Jump browser game icon">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#120f24">
</head>

<body>
  <main class="game-page">
    <section class="game-shell" aria-label="Lava Jump">
      <div id="game-root" class="game-root" aria-live="polite"></div>

      <div class="game-instructions" aria-label="Game instructions">
        <div><span>&larr;</span> <span>&rarr;</span> &ndash; move, <span>Space</span> &ndash; jump, <span>R</span> &ndash; restart</div>
      </div>
    </section>
  </main>

  <noscript>
    <p class="noscript-message">This game needs JavaScript enabled to run.</p>
  </noscript>

</body>

</html>
